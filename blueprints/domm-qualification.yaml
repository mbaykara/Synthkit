name: domm-qualification
label: domm-qualification
shape: business_hours_plateau
timezone: Europe/Berlin
series_budget: 30000
metadata:
  description: Bounded production-like application estate used to qualify DOMM from ordinary telemetry.
  owner: domm-qualification
  category: qualification
  tags: [qualification, application-observability]

environments:
  - name: prod
    production: true
    weight: 1.0
    cloud:
      provider: aws
      account_id: "100000000001"
      region: eu-west-2
      vpc_id: vpc-domm-qualification-prod
    cluster:
      type: eks
      name: domm-qualification-prod
      k8s_monitoring:
        features:
          promote_namespace_to_service_namespace: true
      node_groups:
        - { name: applications, instance_type: m6i.large, desired: 2 }
  - name: staging
    production: false
    weight: 0.18
    cloud:
      provider: aws
      account_id: "100000000002"
      region: eu-west-2
      vpc_id: vpc-domm-qualification-staging
    cluster:
      type: eks
      name: domm-qualification-staging
      k8s_monitoring:
        features:
          promote_namespace_to_service_namespace: true
      node_groups:
        - { name: applications, instance_type: m6i.large, desired: 1 }

workloads:
  # L1 fixture: an ownership-labelled workload is visible through platform
  # telemetry, but has not adopted application metrics, logs, traces, profiles,
  # dashboards, SLOs, alerts, or release attribution.
  - type: app
    name: northstar-partner-portal
    runs_on: domm-qualification-prod
    traces: false
    traffic: { shape: diurnal, off_peak_rps: 0.08, peak_rps: 0.8, request_latency_p95_ms: 780 }
    services:
      - name: re-api
        type: web
        runtime: python
        entry: true
        namespace: northstar-partner-portal
        routes: [GET /v1/status]

  # L3 fixture: one real service has metrics, logs, and a meaningful scoped
  # alert, but the dedicated qualification scenario proves that alert still
  # flaps. It has not adopted traces, profiles, dashboards, SLOs, or release
  # attribution.
  - type: app
    name: northstar-order-intake
    runs_on: domm-qualification-prod
    traces: false
    traffic: { shape: diurnal, off_peak_rps: 0.12, peak_rps: 1.2, request_latency_p95_ms: 620 }
    services:
      - name: pe-api
        type: web
        runtime: go
        entry: true
        namespace: northstar-order-intake
        routes: [GET /v1/orders]
        metrics:
          - name: http_server_requests_total
            instrument: counter
            labels:
              service_namespace: { const_str: "northstar-order-intake" }
              http_response_status_code: { const_str: "200" }
            value: { shape: { base: 12.0, mode: throughput_drop } }
          - name: http_server_requests_total
            instrument: counter
            labels:
              service_namespace: { const_str: "northstar-order-intake" }
              http_response_status_code: { const_str: "500" }
            value: { shape: { base: 0.4, mode: error_spike } }
        logs:
          - source: application
            stream_labels:
              service_namespace: { const_str: "northstar-order-intake" }
              deployment_environment_name: { const_str: "prod" }
            body:
              message: { const_str: "orders request completed" }
              route: { ref: route }
              status: { ref: status }
  # L4 fixture: a small service emits the same metrics and structured logs as
  # the L3 fixture, but its meaningful alert follows one stable fire/recovery
  # cycle. It intentionally has no trace backend adoption.
  - type: app
    name: northstar-product-catalog
    runs_on: domm-qualification-prod
    traces: false
    traffic: { shape: diurnal, off_peak_rps: 0.16, peak_rps: 1.6, request_latency_p95_ms: 540 }
    services:
      - name: pbase-api
        type: web
        runtime: go
        entry: true
        namespace: northstar-product-catalog
        routes: [GET /v1/catalog]
        metrics:
          - name: http_server_requests_total
            instrument: counter
            labels:
              service_namespace: { const_str: "northstar-product-catalog" }
              http_response_status_code: { const_str: "200" }
            value: { shape: { base: 16.0, mode: throughput_drop } }
          - name: http_server_requests_total
            instrument: counter
            labels:
              service_namespace: { const_str: "northstar-product-catalog" }
              http_response_status_code: { const_str: "500" }
            value: { shape: { base: 0.5, mode: error_spike } }
        logs:
          - source: application
            stream_labels:
              service_namespace: { const_str: "northstar-product-catalog" }
              deployment_environment_name: { const_str: "prod" }
            body:
              message: { const_str: "catalog request completed" }
              route: { ref: route }
              status: { ref: status }
              correlation_id: { ref: correlation_id }

  # L2 fixture: four services emit normal application telemetry and reusable
  # signal templates, but none has meaningful-alert coverage. Synthkit never
  # emits DOMM facts, scores, or markers.
  - type: app
    name: northstar-digital-storefront
    runs_on: domm-qualification-prod
    traffic: { shape: diurnal, off_peak_rps: 0.25, peak_rps: 2.5, request_latency_p95_ms: 420 }
    services:
      - name: rx-gateway
        type: gateway
        runtime: go
        entry: true
        namespace: northstar-digital-storefront
        version: "2.4.1"
        routes: [GET /api/catalog, POST /api/checkout]
        profiles: &go_signals [scraped_http_server, runtime_go]
        metrics: &rx_request_metrics
          - name: http_server_requests_total
            instrument: counter
            labels:
              service_namespace: { const_str: "northstar-digital-storefront" }
              http_response_status_code: { const_str: "200" }
            value: { shape: { base: 20.0, mode: throughput_drop } }
          - name: http_server_request_duration_seconds
            instrument: histogram
            buckets: [0.05, 0.1, 0.25, 0.5, 1.0, 2.5, 5.0]
            labels:
              service_namespace: { const_str: "northstar-digital-storefront" }
            value: { normal: { mean: 0.24, stddev: 0.08 } }
          - name: application_saturation_ratio
            instrument: gauge
            labels:
              service_namespace: { const_str: "northstar-digital-storefront" }
            value: { float_range: { min: 0.22, max: 0.68 } }
        logs: &application_logs
          - source: application
            stream_labels:
              service_namespace: { const_str: "northstar-digital-storefront" }
              deployment_environment_name: { const_str: "prod" }
            body:
              message: { const_str: "request completed" }
              route: { ref: route }
              status: { ref: status }
              trace_id: { ref: trace_id }
              correlation_id: { ref: correlation_id }
        calls: [rx-catalog, rx-checkout]
      - { name: rx-catalog, type: web, runtime: jvm, namespace: northstar-digital-storefront, version: "4.8.0", routes: [GET /v1/products], profiles: &jvm_signals [scraped_http_server, runtime_jvm], metrics: *rx_request_metrics, logs: *application_logs, calls: [rx-inventory] }
      - { name: rx-inventory, type: web, runtime: python, namespace: northstar-digital-storefront, version: "1.12.3", routes: [GET /v1/stock], profiles: &python_signals [scraped_http_server, runtime_python], metrics: *rx_request_metrics, logs: *application_logs }
      - { name: rx-checkout, type: web, runtime: node, namespace: northstar-digital-storefront, version: "3.6.2", routes: [POST /v1/orders], profiles: &node_signals [scraped_http_server, runtime_node], metrics: *rx_request_metrics, logs: *application_logs }

  # Ten services, of which the Grafana fixture gives exactly five a meaningful
  # alert. This is the strict 50% near-miss fixture.
  - type: app
    name: northstar-marketplace
    runs_on: domm-qualification-prod
    traffic: { shape: diurnal, off_peak_rps: 0.4, peak_rps: 4.0, request_latency_p95_ms: 510 }
    services:
      - name: pb-gateway
        type: gateway
        runtime: go
        entry: true
        namespace: northstar-marketplace
        version: "2.4.1"
        routes: [GET /api/catalog, POST /api/checkout]
        profiles: &pb_go_signals [scraped_http_server, runtime_go]
        metrics: &pb_alert_metrics
          - name: http_server_requests_total
            instrument: counter
            labels:
              service_namespace: { const_str: "northstar-marketplace" }
              http_response_status_code: { const_str: "200" }
            value: { shape: { base: 20.0, mode: throughput_drop } }
          - name: http_server_request_duration_seconds
            instrument: histogram
            buckets: [0.05, 0.1, 0.25, 0.5, 1.0, 2.5, 5.0]
            labels:
              service_namespace: { const_str: "northstar-marketplace" }
            value: { normal: { mean: 0.31, stddev: 0.11 } }
          - name: application_saturation_ratio
            instrument: gauge
            labels:
              service_namespace: { const_str: "northstar-marketplace" }
            value: { float_range: { min: 0.28, max: 0.74 } }
          - name: http_server_requests_total
            instrument: counter
            labels:
              service_namespace: { const_str: "northstar-marketplace" }
              http_response_status_code: { const_str: "500" }
            value: { shape: { base: 1.0, mode: error_spike } }
        logs: &pb_application_logs
          - source: application
            stream_labels:
              service_namespace: { const_str: "northstar-marketplace" }
              deployment_environment_name: { const_str: "prod" }
            body:
              message: { const_str: "request completed" }
              route: { ref: route }
              status: { ref: status }
              trace_id: { ref: trace_id }
              correlation_id: { ref: correlation_id }
        calls: [pb-catalog, pb-checkout, pb-search]
      - { name: pb-catalog, type: web, runtime: jvm, namespace: northstar-marketplace, version: "4.8.0", routes: [GET /v1/products], profiles: &pb_jvm_signals [scraped_http_server, runtime_jvm], metrics: *pb_alert_metrics, logs: *pb_application_logs, calls: [pb-inventory] }
      - { name: pb-inventory, type: web, runtime: python, namespace: northstar-marketplace, version: "1.12.3", routes: [GET /v1/stock], profiles: &pb_python_signals [scraped_http_server, runtime_python], metrics: *pb_alert_metrics, logs: *pb_application_logs }
      - { name: pb-checkout, type: web, runtime: node, namespace: northstar-marketplace, version: "3.6.2", routes: [POST /v1/orders], profiles: &pb_node_signals [scraped_http_server, runtime_node], metrics: *pb_alert_metrics, logs: *pb_application_logs, calls: [pb-payment, pb-orders] }
      - { name: pb-payment, type: grpc, runtime: go, namespace: northstar-marketplace, version: "5.3.0", routes: [POST /payments.Charge], profiles: *pb_go_signals, metrics: *pb_alert_metrics, logs: *pb_application_logs }
      - name: pb-orders
        type: worker
        runtime: python
        namespace: northstar-marketplace
        version: "2.9.4"
        routes: [CONSUME orders.created]
        profiles: *pb_python_signals
        metrics: &pb_request_metrics
          - name: http_server_requests_total
            instrument: counter
            labels:
              service_namespace: { const_str: "northstar-marketplace" }
              http_response_status_code: { const_str: "200" }
            value: { shape: { base: 20.0, mode: throughput_drop } }
          - name: http_server_request_duration_seconds
            instrument: histogram
            buckets: [0.05, 0.1, 0.25, 0.5, 1.0, 2.5, 5.0]
            labels:
              service_namespace: { const_str: "northstar-marketplace" }
            value: { normal: { mean: 0.31, stddev: 0.11 } }
          - name: application_saturation_ratio
            instrument: gauge
            labels:
              service_namespace: { const_str: "northstar-marketplace" }
            value: { float_range: { min: 0.28, max: 0.74 } }
        logs: *pb_application_logs
        calls: [pb-datastore, pb-notification]
      - { name: pb-datastore, type: db, runtime: go, namespace: northstar-marketplace, version: "15.6", profiles: *pb_go_signals, metrics: *pb_request_metrics, logs: *pb_application_logs }
      - { name: pb-search, type: web, runtime: jvm, namespace: northstar-marketplace, version: "6.1.1", routes: [GET /v1/search], profiles: *pb_jvm_signals, metrics: *pb_request_metrics, logs: *pb_application_logs }
      - { name: pb-shipping, type: web, runtime: go, namespace: northstar-marketplace, version: "1.7.5", routes: [POST /v1/quotes], profiles: *pb_go_signals, metrics: *pb_request_metrics, logs: *pb_application_logs }
      - { name: pb-notification, type: worker, runtime: node, namespace: northstar-marketplace, version: "3.2.8", routes: [CONSUME notification.requested], profiles: *pb_node_signals, metrics: *pb_request_metrics, logs: *pb_application_logs }

  # L5 fixture: ten services with six meaningful alerts, rich correlated
  # telemetry, and no curated dashboard. This is the smallest positive
  # Proactive estate under the strict greater-than-half alert rule.
  - type: app
    name: northstar-commerce-platform
    runs_on: domm-qualification-prod
    traffic: { shape: diurnal, off_peak_rps: 0.5, peak_rps: 5.0, request_latency_p95_ms: 560 }
    services:
      - name: pc-gateway
        type: gateway
        runtime: go
        entry: true
        namespace: northstar-commerce-platform
        version: "2.4.2"
        routes: [GET /api/catalog, POST /api/checkout]
        profiles: &pc_go_signals [scraped_http_server, runtime_go]
        metrics: &pc_alert_metrics
          - name: http_server_requests_total
            instrument: counter
            labels:
              service_namespace: { const_str: "northstar-commerce-platform" }
              http_response_status_code: { const_str: "200" }
            value: { shape: { base: 20.0, mode: throughput_drop } }
          - name: http_server_request_duration_seconds
            instrument: histogram
            buckets: [0.05, 0.1, 0.25, 0.5, 1.0, 2.5, 5.0]
            labels:
              service_namespace: { const_str: "northstar-commerce-platform" }
            value: { normal: { mean: 0.34, stddev: 0.12 } }
          - name: application_saturation_ratio
            instrument: gauge
            labels:
              service_namespace: { const_str: "northstar-commerce-platform" }
            value: { float_range: { min: 0.26, max: 0.72 } }
          - name: http_server_requests_total
            instrument: counter
            labels:
              service_namespace: { const_str: "northstar-commerce-platform" }
              http_response_status_code: { const_str: "500" }
            value: { shape: { base: 1.0, mode: error_spike } }
        logs: &pc_application_logs
          - source: application
            stream_labels:
              service_namespace: { const_str: "northstar-commerce-platform" }
              deployment_environment_name: { const_str: "prod" }
            body:
              message: { const_str: "request completed" }
              route: { ref: route }
              status: { ref: status }
              trace_id: { ref: trace_id }
              correlation_id: { ref: correlation_id }
        calls: [pc-catalog, pc-checkout, pc-search]
      - { name: pc-catalog, type: web, runtime: jvm, namespace: northstar-commerce-platform, version: "4.9.0", routes: [GET /v1/products], profiles: &pc_jvm_signals [scraped_http_server, runtime_jvm], metrics: *pc_alert_metrics, logs: *pc_application_logs, calls: [pc-inventory] }
      - { name: pc-inventory, type: web, runtime: python, namespace: northstar-commerce-platform, version: "1.13.0", routes: [GET /v1/stock], profiles: &pc_python_signals [scraped_http_server, runtime_python], metrics: *pc_alert_metrics, logs: *pc_application_logs }
      - { name: pc-checkout, type: web, runtime: node, namespace: northstar-commerce-platform, version: "3.7.0", routes: [POST /v1/orders], profiles: &pc_node_signals [scraped_http_server, runtime_node], metrics: *pc_alert_metrics, logs: *pc_application_logs, calls: [pc-payment, pc-orders] }
      - { name: pc-payment, type: grpc, runtime: go, namespace: northstar-commerce-platform, version: "5.4.0", routes: [POST /payments.Charge], profiles: *pc_go_signals, metrics: *pc_alert_metrics, logs: *pc_application_logs }
      - { name: pc-orders, type: worker, runtime: python, namespace: northstar-commerce-platform, version: "2.10.0", routes: [CONSUME orders.created], profiles: *pc_python_signals, metrics: *pc_alert_metrics, logs: *pc_application_logs, calls: [pc-datastore, pc-notification] }
      - name: pc-datastore
        type: db
        runtime: go
        namespace: northstar-commerce-platform
        version: "15.6"
        profiles: *pc_go_signals
        metrics: &pc_request_metrics
          - name: http_server_requests_total
            instrument: counter
            labels:
              service_namespace: { const_str: "northstar-commerce-platform" }
              http_response_status_code: { const_str: "200" }
            value: { shape: { base: 20.0, mode: throughput_drop } }
          - name: http_server_request_duration_seconds
            instrument: histogram
            buckets: [0.05, 0.1, 0.25, 0.5, 1.0, 2.5, 5.0]
            labels:
              service_namespace: { const_str: "northstar-commerce-platform" }
            value: { normal: { mean: 0.34, stddev: 0.12 } }
          - name: application_saturation_ratio
            instrument: gauge
            labels:
              service_namespace: { const_str: "northstar-commerce-platform" }
            value: { float_range: { min: 0.26, max: 0.72 } }
        logs: *pc_application_logs
      - { name: pc-search, type: web, runtime: jvm, namespace: northstar-commerce-platform, version: "6.2.0", routes: [GET /v1/search], profiles: *pc_jvm_signals, metrics: *pc_request_metrics, logs: *pc_application_logs }
      - { name: pc-shipping, type: web, runtime: go, namespace: northstar-commerce-platform, version: "1.8.0", routes: [POST /v1/quotes], profiles: *pc_go_signals, metrics: *pc_request_metrics, logs: *pc_application_logs }
      - { name: pc-notification, type: worker, runtime: node, namespace: northstar-commerce-platform, version: "3.3.0", routes: [CONSUME notification.requested], profiles: *pc_node_signals, metrics: *pc_request_metrics, logs: *pc_application_logs }

  # Exact L6 fixture. It has strong metrics/logs/traces but deliberately no
  # Pyroscope SDK lane; its L7 operational prerequisites are also omitted by
  # the Grafana fixture.
  - type: app
    name: northstar-fulfillment-platform
    runs_on: domm-qualification-prod
    traffic: { shape: diurnal, off_peak_rps: 0.6, peak_rps: 6.0, request_latency_p95_ms: 610 }
    services:
      - name: se-gateway
        type: gateway
        runtime: go
        entry: true
        namespace: northstar-fulfillment-platform
        version: "7.1.0"
        routes: [GET /api/catalog, POST /api/checkout]
        profiles: &se_go_signals [scraped_http_server, runtime_go]
        metrics: &se_alert_metrics
          - name: http_server_requests_total
            instrument: counter
            labels:
              service_namespace: { const_str: "northstar-fulfillment-platform" }
              http_response_status_code: { const_str: "200" }
            value: { shape: { base: 20.0, mode: throughput_drop } }
          - name: http_server_request_duration_seconds
            instrument: histogram
            buckets: [0.05, 0.1, 0.25, 0.5, 1.0, 2.5, 5.0]
            labels:
              service_namespace: { const_str: "northstar-fulfillment-platform" }
            value: { normal: { mean: 0.37, stddev: 0.13 } }
          - name: application_saturation_ratio
            instrument: gauge
            labels:
              service_namespace: { const_str: "northstar-fulfillment-platform" }
            value: { float_range: { min: 0.24, max: 0.70 } }
          - name: http_server_requests_total
            instrument: counter
            labels:
              service_namespace: { const_str: "northstar-fulfillment-platform" }
              http_response_status_code: { const_str: "500" }
            value: { shape: { base: 1.0, mode: error_spike } }
        logs: &se_application_logs
          - source: application
            stream_labels:
              service_namespace: { const_str: "northstar-fulfillment-platform" }
              deployment_environment_name: { const_str: "prod" }
            body:
              message: { const_str: "request completed" }
              route: { ref: route }
              status: { ref: status }
              trace_id: { ref: trace_id }
              correlation_id: { ref: correlation_id }
        calls: [se-catalog, se-checkout, se-search]
      - name: se-catalog
        type: web
        runtime: jvm
        namespace: northstar-fulfillment-platform
        version: "7.1.0"
        routes: [GET /v1/products]
        profiles: &se_jvm_signals [scraped_http_server, runtime_jvm]
        metrics: &se_request_metrics
          - name: http_server_requests_total
            instrument: counter
            labels:
              service_namespace: { const_str: "northstar-fulfillment-platform" }
              http_response_status_code: { const_str: "200" }
            value: { shape: { base: 20.0, mode: throughput_drop } }
          - name: http_server_request_duration_seconds
            instrument: histogram
            buckets: [0.05, 0.1, 0.25, 0.5, 1.0, 2.5, 5.0]
            labels:
              service_namespace: { const_str: "northstar-fulfillment-platform" }
            value: { normal: { mean: 0.37, stddev: 0.13 } }
          - name: application_saturation_ratio
            instrument: gauge
            labels:
              service_namespace: { const_str: "northstar-fulfillment-platform" }
            value: { float_range: { min: 0.24, max: 0.70 } }
          - name: http_server_requests_total
            instrument: counter
            labels:
              service_namespace: { const_str: "northstar-fulfillment-platform" }
              http_response_status_code: { const_str: "500" }
            value: { shape: { base: 1.0, mode: error_spike } }
        logs: *se_application_logs
        calls: [se-inventory]
      - { name: se-inventory, type: web, runtime: python, namespace: northstar-fulfillment-platform, version: "7.1.0", routes: [GET /v1/stock], profiles: &se_python_signals [scraped_http_server, runtime_python], metrics: *se_request_metrics, logs: *se_application_logs }
      - { name: se-checkout, type: web, runtime: node, namespace: northstar-fulfillment-platform, version: "7.0.3", routes: [POST /v1/orders], profiles: &se_node_signals [scraped_http_server, runtime_node], metrics: *se_request_metrics, logs: *se_application_logs, calls: [se-payment, se-orders] }
      - { name: se-payment, type: grpc, runtime: go, namespace: northstar-fulfillment-platform, version: "7.1.0", routes: [POST /payments.Charge], profiles: *se_go_signals, metrics: *se_request_metrics, logs: *se_application_logs }
      - { name: se-orders, type: worker, runtime: python, namespace: northstar-fulfillment-platform, version: "7.1.0", routes: [CONSUME orders.created], profiles: *se_python_signals, metrics: *se_request_metrics, logs: *se_application_logs, calls: [se-datastore] }
      - { name: se-datastore, type: db, runtime: go, namespace: northstar-fulfillment-platform, version: "15.6", profiles: *se_go_signals, metrics: *se_request_metrics, logs: *se_application_logs }
      # Deliberately mirrors a real production rollout gap: this service emits
      # attributable traces but has not yet adopted service.version. That keeps
      # Systematic.early below the 95% release-attribution L7 boundary without
      # injecting any DOMM-native evidence.
      - { name: se-search, type: web, runtime: jvm, namespace: northstar-fulfillment-platform, routes: [GET /v1/search], profiles: *se_jvm_signals, metrics: *se_request_metrics, logs: *se_application_logs }

  # Exact L7 fixture. The same application shape adds real SDK-pushed profiles;
  # the Grafana fixture supplies the independent L7 operational resources.
  - type: app
    name: northstar-checkout-platform
    runs_on: domm-qualification-prod
    traffic: { shape: diurnal, off_peak_rps: 0.7, peak_rps: 7.0, request_latency_p95_ms: 650 }
    services:
      - name: sb-gateway
        type: gateway
        runtime: go
        entry: true
        namespace: northstar-checkout-platform
        version: "8.0.0"
        routes: [GET /api/catalog, POST /api/checkout]
        profiles: &sb_go_signals [scraped_http_server, runtime_go]
        metrics: &sb_alert_metrics
          - name: http_server_requests_total
            instrument: counter
            labels:
              service_namespace: { const_str: "northstar-checkout-platform" }
              http_response_status_code: { const_str: "200" }

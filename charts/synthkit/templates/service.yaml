apiVersion: v1
kind: Service
metadata:
  name: {{ include "synthkit.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "synthkit.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "synthkit.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8088
      targetPort: http

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "synthkit.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "synthkit.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "synthkit.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "synthkit.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: synthkit
          image: {{ printf "%s@%s" .Values.image.repository .Values.image.digest | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8088
          env:
            - name: BLUEPRINTS
              value: "/app/blueprints"
            - name: BLUEPRINT_NAMES
              value: "grafana-cloud-workshop"
            - name: JSON_HTTP_ADDR
              value: "0.0.0.0:8088"
            - name: SYNTHKIT_BIND
              value: "0.0.0.0"
            - name: CONFIG_SNAPSHOT_PATH
              value: "/data/control-state.json"
            - name: BLUEPRINT_DATA_DIR
              value: "/data/blueprints"
            - name: CONTROL_EXPOSURE_ACK
              value: "trusted-network"
            - name: SELFOBS_ENABLED
              value: "false"
            - name: DRY_RUN
              value: {{ .Values.dryRun | quote }}
            - name: CONTROL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret | quote }}
                  key: CONTROL_TOKEN
                  optional: false
            {{- range $key := list "GC_TOKEN" "GC_PROM_RW" "GC_PROM_USER" "GC_OTLP_ENDPOINT" "GC_OTLP_USER" "GC_LOKI" "GC_LOKI_USER" "GC_PROFILES_URL" "GC_PROFILES_USER" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.existingSecret | quote }}
                  key: {{ $key }}
                  optional: {{ $.Values.dryRun }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /app/synthkit
                - -healthcheck
                - -healthcheck-require-profiles
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: state
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: {{ include "synthkit.claimName" . | quote }}
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
